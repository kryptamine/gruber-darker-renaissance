# Generated by `make extras` from palette.lua. Do not edit by hand.

# EZA_COLORS overrides this file, so unset it.
# eza merges a theme over its own defaults, many of them bold or underlined,
# so every entry sets is_bold (and is_underline where it matters).

colourful: true

# Directories and executables stand out, the rest reads as plain text
filekinds:
  normal: {foreground: "#d2d2cc", is_bold: false}
  directory: {foreground: "#9fb2d6", is_bold: false}
  symlink: {foreground: "#96a29c", is_bold: false}
  pipe: {foreground: "#cc8c3c", is_bold: false}
  block_device: {foreground: "#cc8c3c", is_bold: false}
  char_device: {foreground: "#cc8c3c", is_bold: false}
  socket: {foreground: "#cc8c3c", is_bold: false}
  special: {foreground: "#cc8c3c", is_bold: false}
  executable: {foreground: "#8ac568", is_bold: false}
  mount_point: {foreground: "#9fb2d6", is_bold: false, is_underline: false}

file_type:
  image: {foreground: "#9e95c7", is_bold: false}
  video: {foreground: "#9e95c7", is_bold: false}
  music: {foreground: "#9e95c7", is_bold: false}
  lossless: {foreground: "#9e95c7", is_bold: false}
  crypto: {foreground: "#d64c4b", is_bold: false}
  document: {foreground: "#d2d2cc", is_bold: false}
  compressed: {foreground: "#cc8c3c", is_bold: false}
  temp: {foreground: "#6e6a64", is_bold: false}
  compiled: {foreground: "#8c8c8c", is_bold: false}
  build: {foreground: "#efd45b", is_bold: false, is_underline: false}
  source: {foreground: "#d2d2cc", is_bold: false}

# The user triplet in color, group and other in gray
perms:
  user_read: {foreground: "#efd45b", is_bold: false}
  user_write: {foreground: "#d64c4b", is_bold: false}
  user_execute_file: {foreground: "#8ac568", is_bold: false, is_underline: false}
  user_execute_other: {foreground: "#8ac568", is_bold: false}
  group_read: {foreground: "#8c8c8c", is_bold: false}
  group_write: {foreground: "#8c8c8c", is_bold: false}
  group_execute: {foreground: "#8c8c8c", is_bold: false}
  other_read: {foreground: "#8c8c8c", is_bold: false}
  other_write: {foreground: "#8c8c8c", is_bold: false}
  other_execute: {foreground: "#8c8c8c", is_bold: false}
  special_user_file: {foreground: "#9e95c7", is_bold: false}
  special_other: {foreground: "#9e95c7", is_bold: false}
  attribute: {foreground: "#555555", is_bold: false}

# Metadata in gray, units a step darker, so names carry the line
size:
  major: {foreground: "#8c8c8c", is_bold: false}
  minor: {foreground: "#555555", is_bold: false}
  number_byte: {foreground: "#8c8c8c", is_bold: false}
  number_kilo: {foreground: "#8c8c8c", is_bold: false}
  number_mega: {foreground: "#8c8c8c", is_bold: false}
  number_giga: {foreground: "#8c8c8c", is_bold: false}
  number_huge: {foreground: "#8c8c8c", is_bold: false}
  unit_byte: {foreground: "#555555", is_bold: false}
  unit_kilo: {foreground: "#555555", is_bold: false}
  unit_mega: {foreground: "#555555", is_bold: false}
  unit_giga: {foreground: "#555555", is_bold: false}
  unit_huge: {foreground: "#555555", is_bold: false}

users:
  user_you: {foreground: "#8c8c8c", is_bold: false}
  user_root: {foreground: "#d64c4b", is_bold: false}
  user_other: {foreground: "#8c8c8c", is_bold: false}
  group_yours: {foreground: "#8c8c8c", is_bold: false}
  group_other: {foreground: "#8c8c8c", is_bold: false}
  group_root: {foreground: "#d64c4b", is_bold: false}

links:
  normal: {foreground: "#8c8c8c", is_bold: false}
  multi_link_file: {foreground: "#efd45b", is_bold: false}

date: {foreground: "#8c8c8c", is_bold: false}
inode: {foreground: "#8c8c8c", is_bold: false}
blocks: {foreground: "#8c8c8c", is_bold: false}
octal: {foreground: "#8c8c8c", is_bold: false}
flags: {foreground: "#8c8c8c", is_bold: false}
header: {foreground: "#8c8c8c", is_bold: false, is_underline: false}
punctuation: {foreground: "#555555", is_bold: false}

git:
  new: {foreground: "#8ac568", is_bold: false}
  modified: {foreground: "#efd45b", is_bold: false}
  deleted: {foreground: "#d64c4b", is_bold: false}
  renamed: {foreground: "#9fb2d6", is_bold: false}
  typechange: {foreground: "#9e95c7", is_bold: false}
  ignored: {foreground: "#6e6a64", is_bold: false}
  conflicted: {foreground: "#f26063", is_bold: false}

git_repo:
  branch_main: {foreground: "#8ac568", is_bold: false}
  branch_other: {foreground: "#9e95c7", is_bold: false}
  git_clean: {foreground: "#8ac568", is_bold: false}
  git_dirty: {foreground: "#efd45b", is_bold: false}

symlink_path: {foreground: "#96a29c", is_bold: false}
control_char: {foreground: "#d64c4b", is_bold: false}
broken_symlink: {foreground: "#d64c4b", is_bold: false}
broken_path_overlay: {foreground: "#d64c4b", is_bold: false, is_underline: true}
