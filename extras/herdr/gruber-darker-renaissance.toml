# Generated by `make extras` from palette.lua. Do not edit by hand.

# The "terminal" base takes the ANSI colors from the host terminal
[theme]
name = "terminal"

[theme.custom]
accent = "#fbde55"
panel_bg = "#000000"
active_row_bg = "#1e1e1e"
# Left unset, it falls back to the background and the sidebar cursor vanishes
selection_bg = "#555555"
surface_dim = "#000000"
surface0 = "#181818"
surface1 = "#1e1e1e"
overlay0 = "#484848"
overlay1 = "#555555"
text = "#dcdcd6"
subtext0 = "#96a29c"
red = "#e74e4e"
green = "#8fd069"
yellow = "#fbde55"
blue = "#a7bbe3"
mauve = "#9e95c7"
teal = "#96a29c"
peach = "#cc8c3c"
