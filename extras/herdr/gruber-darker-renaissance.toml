# Generated by `make extras` from palette.lua. Do not edit by hand.

# The "terminal" base takes the ANSI colors from the host terminal
[theme]
name = "terminal"

[theme.custom]
accent = "#efd45b"
panel_bg = "#000000"
active_row_bg = "#1e1e1e"
# Left unset, it falls back to the background and the sidebar cursor vanishes
selection_bg = "#555555"
surface_dim = "#000000"
surface0 = "#181818"
surface1 = "#1e1e1e"
overlay0 = "#484848"
overlay1 = "#555555"
text = "#d2d2cc"
subtext0 = "#96a29c"
red = "#d64c4b"
green = "#8ac568"
yellow = "#efd45b"
blue = "#9fb2d6"
mauve = "#9e95c7"
teal = "#96a29c"
peach = "#cc8c3c"
